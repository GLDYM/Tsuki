modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/tsuki"
logoFile="logo.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="tsuki.mixins.json"
[[dependencies.tsuki]]
    modId="neoforge"
    type = "required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.tsuki]]
    modId="minecraft"
    type = "required"
    versionRange="[1.21.1, 1.21.2)"
    ordering="NONE"
    side="BOTH"
[[dependencies.tsuki]]
    modId="geckolib"
    type = "required"
    versionRange="[4.8.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.tsuki]]
    modId="guideme"
    type = "optional"
    versionRange="[21,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.tsuki]]
    modId="ageratum"
    type = "optional"
    versionRange="[0.0.1,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.tsuki]]
    modId="lithostitched"
    type = "optional"
    versionRange="[1.6,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.tsuki]]
    modId="jade"
    type = "optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"
