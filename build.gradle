plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}"
group = "${mod_group_id}"
base {
    archivesName = "${mod_name}"
}

// Mojang ships Java 21 to end users in 1.21+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
    guideRun
}

neoForge {
    version = project.neo_version

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = false

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.guideRun

    mods {
        "tsuki" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', "tsuki", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }

        guide {
            client()
            sourceSet = sourceSets.guideRun
            loadedMods = [mods.tsuki]
            systemProperty 'guideme.tsuki.guide.sources', file('src/main/resources/assets/tsuki/guides/tsuki/guide').getAbsolutePath()
            systemProperty 'guideme.showOnStartup', 'tsuki:guide'
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Put repositories for dependencies here
    // Keep explicit core repositories for stable dependency resolution.
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    maven {
        name = "Patchouli"
        url = "https://maven.blamejared.com"
    }

    maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        name = "Latvian Maven"
        url = "https://maven.latvian.dev/releases"
    }

    // HYW?
    // maven {
    //     name = "Ageratum"
    //     url = "https://maven.anvilcraft.dev/"
    // }

    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://cursemaven.com"
    }
}

dependencies {
    // Ageratum, embedded via Jar-in-Jar.
    // compileOnly "curse.maven:ageratum-1500610:7935946"
    // runtimeOnly "curse.maven:ageratum-1500610:7935946"
    // GuideME
    compileOnly 'org.appliedenergistics:guideme:21.1.15:api'
    // runtimeOnly 'org.appliedenergistics:guideme:21.1.15'
    // Geckolib
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"

    // Compact
    // Epic Fight, Hm?
    // implementation ("maven.modrinth:epic-fight:20.9.2")
    // CuriosAPI, now we don't use it.
    compileOnly ("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
    runtimeOnly ("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1")
    // Jade
    compileOnly "curse.maven:jade-324717:7545219"
    runtimeOnly "curse.maven:jade-324717:7545219"
    // JEI
    compileOnly ("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly ("mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}")
    // runtimeOnly ("mezz.jei:jei-${mc_version}-neoforge:${jei_version}")
    // EMI
	compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    // KubeJS
    compileOnly "dev.latvian.mods:rhino:2101.2.7-build.72"
    compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    // runtimeOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    // Farmers Delight
    compileOnly ("maven.modrinth:farmers-delight:1.21.1-1.3.0")
    runtimeOnly ("maven.modrinth:farmers-delight:1.21.1-1.3.0")
    // Kaleidoscope Cookery
    compileOnly ("curse.maven:kaleidoscope-cookery-1309203:7966281")
    runtimeOnly ("curse.maven:kaleidoscope-cookery-1309203:7966281")
    // TerraBlender
    compileOnly "com.github.glitchfiend:TerraBlender-neoforge:${mc_version}-4.1.0.8"
    // runtimeOnly "com.github.glitchfiend:TerraBlender-neoforge:${mc_version}-4.1.0.8"

    // Dev Tools
    // MCMOD Export Tool
    runtimeOnly "curse.maven:let-me-see-see-your-code-1229018:6777654"
    // Loot Info
    runtimeOnly "curse.maven:advanced-loot-info-1205426:7938903"
    // We need a tech mod to test fluid.
    runtimeOnly "curse.maven:create-328085:7963363"

    // Guide
    guideRunRuntimeOnly 'org.appliedenergistics:guideme:21.1.15'
    guideRunRuntimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "tracen_minecraft_group",
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : "tracen_minecraft_group",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version project.version
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
