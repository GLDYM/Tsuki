plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
     // This should be below the net.minecraftforge.gradle plugin
//    id 'org.parchmentmc.librarian.forgegradle' version '1.+'

    // Apply the plugin. You can find the latest version at https://projects.neoforged.net/neoforged/ModDevGradle
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.2'
group = 'cn.mcmod.tsuki' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base {
    archivesName = 'Tsuki'
}

// Mojang ships Java 21 to end users in 1.21+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"


neoForge {
    // Develop against NeoForge for Minecraft 1.21.1
    version = "21.1.224"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = false

    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = "1.21"
        mappingsVersion = "2024.11.10"
    }

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', "tsuki", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'mysterious_mountain_lib'
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "tsuki" {
            sourceSet sourceSets.main
        }
    }
}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version            : version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // Keep explicit core repositories for stable dependency resolution.
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    // Patchouli
    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://cursemaven.com"
    }
}

dependencies {

    // Use local MMLib jar from project libs/ to match current source API.
    compileOnly files('libs/mysterious_mountain_lib-1.2.15-1.21.1.jar')
    runtimeOnly files('libs/mysterious_mountain_lib-1.2.15-1.21.1.jar')
    // Compile against only the API artifact
    compileOnly(("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"))
    // Use the full Curios API jar at runtime
    runtimeOnly(("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"))
    // Patchouli will be removed in the future, but not now
    compileOnly ("vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE")
    runtimeOnly ("vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE")

    // compile against the JEI API but do not include it at runtime
    compileOnly(("mezz.jei:jei-${mc_version}-common-api:${jei_version}"))
    compileOnly(("mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"))
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly(("mezz.jei:jei-${mc_version}-neoforge:${jei_version}"))

    compileOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"

    // Compact
    //implementation ("maven.modrinth:epic-fight:20.9.2")
    compileOnly ("maven.modrinth:farmers-delight:1.21.1-1.2.11")
    runtimeOnly ("maven.modrinth:farmers-delight:1.21.1-1.2.11")

    compileOnly ("curse.maven:kaleidoscope-cookery-1309203:7738871")
    runtimeOnly ("curse.maven:kaleidoscope-cookery-1309203:7738871")

    // Dev Tools
    runtimeOnly "curse.maven:let-me-see-see-your-code-1229018:6777654"
    runtimeOnly "curse.maven:advanced-loot-info-1205426:7938903"
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "tsuki",
                "Specification-Vendor"    : "tracen_minecraft_group",
                "Specification-Version"   : "0.0.2",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "tracen_minecraft_group",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
